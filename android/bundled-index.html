var BUNDLED_HTML = "<!DOCTYPE html>\n<!--build:5-->\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>حضور وانصراف | محمد وادي<\/title>\n<style>\n* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }\nhtml, body { margin: 0; padding: 0; min-height: 100%; }\nbody {\n  font-family: system-ui, 'Segoe UI', 'Noto Kufi Arabic', sans-serif;\n  background: #f4f4f8;\n  color: #1c1b22;\n  padding: 16px 14px 40px;\n}\n.card { max-width: 720px; margin: 0 auto; }\n.hero {\n  background: linear-gradient(135deg, #6366f1, #8b5cf6);\n  border-radius: 14px; color: #fff; padding: 10px 16px; margin-bottom: 12px;\n  box-shadow: 0 6px 18px rgba(99,102,241,.28);\n}\n.hero h1 { margin: 0 0 2px; font-size: 16.5px; }\n.hero .date { font-size: 12px; opacity: .92; font-weight: 600; }\n.hero .intro { font-size: 12px; opacity: .88; margin: 4px 0 0; line-height: 1.6; }\n.group { background: #fff; border-radius: 18px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(20,20,40,.06); }\n.group-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }\n.group-head h2 { margin: 0; font-size: 16.5px; display: flex; align-items: center; gap: 8px; }\n.group-head h2 svg { color: #6366f1; }\n.pill { font-size: 12.5px; font-weight: 600; color: #4f46e5; background: #eef2ff; border-radius: 999px; padding: 3px 12px; }\n.hint { font-size: 13.5px; color: #6b6a75; line-height: 1.7; margin: 6px 0; }\n.add-row { display: flex; align-items: stretch; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }\n.add-row input {\n  flex: 1 1 180px; border: 1.5px solid #e2e1ea; border-radius: 12px; padding: 10px 14px;\n  font: inherit; font-size: 15px; background: #fafafc; min-height: 44px;\n}\n.add-row input:focus { outline: none; border-color: #8b5cf6; background: #fff; }\n.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid #efedf3; flex-wrap: wrap; }\n.row:last-child { border-bottom: none; }\n.who { flex: 1 1 170px; min-width: 0; display: flex; align-items: center; gap: 12px; }\n.who-text { min-width: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }\n.avatar { border-radius: 50%; color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; box-shadow: 0 2px 6px rgba(0,0,0,.18); width: 40px; height: 40px; font-size: 17px; }\n.name { font-weight: 600; overflow-wrap: anywhere; font-size: 15.5px; }\n.badge { display: inline-flex; align-items: center; font-size: 12.5px; color: #6b6a75; background: #f3f1f2; border-radius: 999px; padding: 3px 11px; }\n.badge-in { background: #e6f6ee; color: #0b7a4b; font-weight: 600; }\n.badge-in::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #12a35f; margin-inline-end: 6px; }\n.badge-done { background: #eef2ff; color: #4f46e5; font-weight: 600; }\n.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; color: #6d28d9; background: #f1ecfe; border-radius: 999px; padding: 3px 11px; }\n.actions { display: flex; gap: 8px; flex-wrap: wrap; }\n.btn { display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: 999px; padding: 9px 15px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 40px; }\n.btn:active { transform: scale(.97); }\n.btn:disabled { opacity: .45; }\n.btn-in { background: linear-gradient(135deg, #10b981, #059669); color: #fff; box-shadow: 0 2px 8px rgba(16,185,129,.35); }\n.btn-out { background: #fff4e0; color: #b45309; border: 1px solid #f4d9a8; }\n.btn-del { background: transparent; color: #6b6a75; border: 1px solid #e2e1ea; }\n.btn-del-confirm { background: #fdecec; color: #c81e3a; border: 1px solid #f5c2c6; font-weight: 700; }\n.btn-add { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; box-shadow: 0 2px 8px rgba(99,102,241,.35); }\n.btn-copy { background: #fff; color: #4f46e5; border: 1.5px solid #c7d2fe; width: 100%; justify-content: center; margin-top: 12px; }\n.btn-copy.done { background: #e6f6ee; color: #0b7a4b; border-color: #a7e5c5; }\n.hours { font-weight: 700; font-size: 16px; background: linear-gradient(135deg, #6366f1, #8b5cf6); -webkit-background-clip: text; background-clip: text; color: transparent; white-space: nowrap; }\n.callout { background: #fff8eb; border: 1px solid #f4d9a8; border-radius: 16px; padding: 14px 16px; font-size: 13.5px; line-height: 1.8; color: #7a5a13; }\n.callout b { display: block; margin-bottom: 4px; color: #92660a; }\n.owner { font-size: 13.5px; font-weight: 700; opacity: .95; margin-top: 4px; letter-spacing: .2px; }\n.foot { text-align: center; font-size: 12.5px; color: #8a8896; margin-top: 18px; }\n<\/style>\n<\/head>\n<body>\n<div class=\"card\">\n  <div class=\"hero\">\n    <h1>حضور وانصراف الموظفين<\/h1>\n    <div class=\"owner\">تطبيق محمد وادي<\/div>\n    <div class=\"date\" id=\"todayLabel\"><\/div>\n    <p class=\"intro\" id=\"intro\"><\/p>\n  <\/div>\n  <div class=\"group\">\n    <div class=\"group-head\"><h2><span id=\"iconUsers\"><\/span>الموظفون<\/h2><span class=\"pill\" id=\"teamCount\"><\/span><\/div>\n    <div class=\"add-row\">\n      <input id=\"nameInput\" type=\"text\" placeholder=\"اسم الموظف (أو كذا اسم بينهم فاصلة)\" enterkeyhint=\"done\">\n      <button class=\"btn btn-add\" id=\"addBtn\"><span id=\"iconAdd\"><\/span>أضف<\/button>\n    <\/div>\n    <div id=\"empList\"><\/div>\n  <\/div>\n  <div class=\"group\">\n    <div class=\"group-head\"><h2><span id=\"iconClock\"><\/span>سجل اليوم<\/h2><span class=\"pill\" id=\"presentCount\"><\/span><\/div>\n    <div id=\"todayList\"><\/div>\n    <button class=\"btn btn-copy\" id=\"copyDay\" style=\"display:none\">انسخ ملخص اليوم<\/button>\n  <\/div>\n  <div class=\"group\">\n    <div class=\"group-head\"><h2><span id=\"iconChart\"><\/span>ساعات شهر المرتب<\/h2><span class=\"pill\" id=\"curPeriod\"><\/span><\/div>\n    <div id=\"monthList\"><\/div>\n    <button class=\"btn btn-copy\" id=\"copyMonth\" style=\"display:none\">انسخ ملخص الشهر<\/button>\n  <\/div>\n  <div class=\"group\" id=\"prevGroup\" style=\"display:none\">\n    <div class=\"group-head\"><h2><span id=\"iconCal\"><\/span>شهر المرتب اللي فات<\/h2><span class=\"pill\" id=\"prevPeriod\"><\/span><\/div>\n    <div id=\"prevList\"><\/div>\n    <button class=\"btn btn-copy\" id=\"copyPrev\">انسخ ملخص الشهر اللي فات<\/button>\n  <\/div>\n  <div class=\"callout\"><b>مهم تعرفه<\/b>الأسماء والتوقيتات بتتحفظ جوه التطبيق على موبايلك نفسه، حتى لو قفلته وفتحته تاني، ومش بتتبعت لأي حد. التطبيق بيحتفظ بشهر المرتب الحالي واللي فات (من 26 لـ 25) — انسخ ملخص الشهر قبل ما الشهرين يعدّوا لو عايز أرشيف أطول. والتطبيق بيحدّث نفسه لوحده أول ما تفتحه والنت شغال.<\/div>\n  <div class=\"foot\">صُنع خصيصاً لمحمد وادي 💜<\/div><div class=\"foot\" style=\"margin-top:4px\">الإصدار 5<\/div>\n<\/div>\n<script>\nvar PERIOD_START_DAY = 26;\nfunction pad(n){ return String(n).padStart(2,'0'); }\nfunction dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }\nfunction minutesOf(d){ return d.getHours()*60 + d.getMinutes(); }\nvar timeFmt = new Intl.DateTimeFormat('ar-EG', { hour:'numeric', minute:'2-digit', numberingSystem:'latn' });\nfunction fmtTime(m){ return timeFmt.format(new Date(2000,0,1,Math.floor(m/60), m%60)); }\nvar dayFmt = new Intl.DateTimeFormat('ar-EG', { weekday:'long', day:'numeric', month:'long', numberingSystem:'latn' });\nvar dayMonthFmt = new Intl.DateTimeFormat('ar-EG', { day:'numeric', month:'long', numberingSystem:'latn' });\nfunction arUnit(n, one, two, few, many){\n  if(n===1) return n+' '+one;\n  if(n===2) return two;\n  if(n>=3 && n<=10) return n+' '+few;\n  return n+' '+many;\n}\nfunction fmtDuration(mins){\n  var h=Math.floor(mins/60), m=mins%60;\n  var hp=arUnit(h,'ساعة','ساعتين','ساعات','ساعة');\n  var mp=arUnit(m,'دقيقة','دقيقتين','دقائق','دقيقة');\n  if(h>0 && m>0) return hp+' و'+mp;\n  if(h>0) return hp;\n  return mp;\n}\nfunction periodStartOf(d){ var y=d.getFullYear(), m=d.getMonth(); return d.getDate()>=PERIOD_START_DAY ? new Date(y,m,PERIOD_START_DAY) : new Date(y,m-1,PERIOD_START_DAY); }\nfunction periodKeyOf(d){ var s=periodStartOf(d); return s.getFullYear()+'-'+pad(s.getMonth()+1); }\nfunction prevPeriodKey(key){ var p=key.split('-').map(Number); var d=new Date(p[0], p[1]-2, 1); return d.getFullYear()+'-'+pad(d.getMonth()+1); }\nfunction periodStartFromKey(key){ var p=key.split('-').map(Number); return new Date(p[0], p[1]-1, PERIOD_START_DAY); }\nfunction periodEndFromKey(key){ var p=key.split('-').map(Number); return new Date(p[0], p[1], PERIOD_START_DAY-1); }\nfunction periodLabel(key){ return 'من '+dayMonthFmt.format(periodStartFromKey(key))+' لحد '+dayMonthFmt.format(periodEndFromKey(key)); }\nfunction dayOffsetOf(d){ var s=periodStartOf(d); return Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(s.getFullYear(),s.getMonth(),s.getDate()))/86400000); }\nfunction emptyBucket(period){ return { period: period, rows: [] }; }\n\nvar AVATARS=[['#6366f1','#8b5cf6'],['#0ea5e9','#06b6d4'],['#f59e0b','#f97316'],['#10b981','#34d399'],['#ec4899','#f43f5e'],['#8b5cf6','#d946ef'],['#14b8a6','#0ea5e9'],['#f97316','#ef4444']];\nfunction avatarFor(id){ var h=0; for(var i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))>>>0; return AVATARS[h%AVATARS.length]; }\n\nvar ICONS={\n  userPlus:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M19 8v6 M22 11h-6',\n  login:'M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4 M10 17l5-5-5-5 M15 12H3',\n  logout:'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4 M16 17l5-5-5-5 M21 12H9',\n  trash:'M3 6h18 M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2 M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6 M10 11v6 M14 11v6',\n  clock:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20 Z M12 6v6l4 2',\n  calendar:'M8 2v4 M16 2v4 M3 10h18 M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2 Z',\n  chart:'M3 3v16a2 2 0 0 0 2 2h16 M7 13l3-3 4 4 5-6',\n  users:'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M23 21v-2a4 4 0 0 0-3-3.87 M16 3.13a4 4 0 0 1 0 7.75'\n};\nfunction svg(d, size){ size=size||16; return '<svg width=\"'+size+'\" height=\"'+size+'\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"'+d+'\"/><\/svg>'; }\nfunction esc(s){ return String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;'); }\nfunction load(key, fallback){\n  try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }\n  catch(e){ return fallback; }\n}\nfunction save(key, val){\n  try { localStorage.setItem(key, JSON.stringify(val)); }\n  catch(e){ alert('مفيش مساحة كفاية للحفظ على الجهاز'); }\n}\nvar now0 = new Date();\nvar curKey = periodKeyOf(now0);\nvar prevKey = prevPeriodKey(curKey);\nvar employees = load('employees.v1', []);\nvar cur = load('att.cur.v2', emptyBucket(curKey));\nvar prev = load('att.prev.v2', emptyBucket(prevKey));\nvar confirmingId = null;\nvar confirmTimer = null;\n\nif(cur.period !== curKey){\n  prev = (cur.period === prevKey) ? cur : (prev.period === prevKey ? prev : emptyBucket(prevKey));\n  cur = emptyBucket(curKey);\n  save('att.cur.v2', cur); save('att.prev.v2', prev);\n}\nif(prev.period !== prevKey){ prev = emptyBucket(prevKey); save('att.prev.v2', prev); }\n\nfunction saveAll(){ save('employees.v1', employees); save('att.cur.v2', cur); save('att.prev.v2', prev); }\nfunction empName(id){ var e = employees.find(function(x){return x.id===id;}); return e ? e.name : 'موظف محذوف'; }\nfunction openRowIndex(empId, todayOffset){\n  return cur.rows.findIndex(function(r){ return r[0]===empId && r[1]===todayOffset && r[3]===null; });\n}\nfunction totalsFor(bucket){\n  var map = {};\n  bucket.rows.forEach(function(r){\n    if(r[3]===null) return;\n    var t = map[r[0]] || { mins:0, days:{} };\n    t.mins += Math.max(0, r[3]-r[2]);\n    t.days[r[1]] = true;\n    map[r[0]] = t;\n  });\n  return map;\n}\nfunction daysCount(t){ return Object.keys(t.days).length; }\n\nfunction copyText(text, btn){\n  function done(){\n    var old = btn.textContent;\n    btn.textContent = 'تم النسخ ✓'; btn.classList.add('done');\n    setTimeout(function(){ btn.textContent = old; btn.classList.remove('done'); }, 1600);\n  }\n  if(navigator.clipboard && navigator.clipboard.writeText){\n    navigator.clipboard.writeText(text).then(done, function(){ legacyCopy(text); done(); });\n  } else { legacyCopy(text); done(); }\n}\nfunction legacyCopy(text){\n  var ta = document.createElement('textarea');\n  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';\n  document.body.appendChild(ta); ta.select();\n  try { document.execCommand('copy'); } catch(e){}\n  document.body.removeChild(ta);\n}\nfunction monthTableHtml(totals){\n  if(employees.length===0) return '<p class=\"hint\">أضف الموظفين الأول عشان تشوف مجموع ساعاتهم هنا.<\/p>';\n  return employees.map(function(emp){\n    var t = totals[emp.id];\n    var days = t ? arUnit(daysCount(t),'يوم','يومين','أيام','يوم')+' حضور' : 'لسه مفيش تسجيل';\n    var hrs = (t && t.mins>0) ? fmtDuration(t.mins) : '0 ساعة';\n    return '<div class=\"row\"><div class=\"who\"><div class=\"who-text\"><div class=\"name\">'+esc(emp.name)+'<\/div><div class=\"badge\">'+days+'<\/div><\/div><\/div><div class=\"hours\">'+hrs+'<\/div><\/div>';\n  }).join('');\n}\nfunction monthSummary(bucket, totals){\n  var lines = employees.map(function(e, n){\n    var t = totals[e.id];\n    var hours = (t && t.mins>0) ? fmtDuration(t.mins) : '0 ساعة';\n    var days = t ? arUnit(daysCount(t),'يوم','يومين','أيام','يوم') : '0 يوم';\n    return (n+1)+'. '+e.name+': '+hours+' ('+days+')';\n  });\n  return ['ملخص ساعات شهر المرتب - '+periodLabel(bucket.period)].concat(lines).join('\\n');\n}\nfunction render(){\n  var now = new Date();\n  var todayOffset = dayOffsetOf(now);\n  document.getElementById('todayLabel').textContent = dayFmt.format(now);\n  document.getElementById('intro').textContent = 'سجّل حضور وانصراف فريقك بلمسة واحدة، والتطبيق يجمع لك ساعات كل موظف تلقائياً على شهر المرتب ('+periodLabel(cur.period)+').';\n  document.getElementById('teamCount').textContent = employees.length+' في الفريق';\n  document.getElementById('curPeriod').textContent = periodLabel(cur.period);\n\n  var curTotals = totalsFor(cur);\n  var presentNow = employees.filter(function(e){ return openRowIndex(e.id, todayOffset)>=0; }).length;\n  document.getElementById('presentCount').textContent = presentNow+' حاضر دلوقتي';\n\n  var empHtml;\n  if(employees.length===0){\n    empHtml = '<p class=\"hint\">أضف أول موظف من فوق، وهيظهر هنا بزرار الحضور والانصراف بتاعه.<\/p>';\n  } else {\n    empHtml = employees.map(function(emp){\n      var idx = openRowIndex(emp.id, todayOffset);\n      var open = idx>=0 ? cur.rows[idx] : null;\n      var t = curTotals[emp.id];\n      var c = avatarFor(emp.id);\n      var badge = open ? '<div class=\"badge badge-in\">حاضر من '+fmtTime(open[2])+'<\/div>' : '<div class=\"badge\">مش مسجل النهاردة<\/div>';\n      var chip = (t && t.mins>0) ? '<div class=\"chip\">'+svg(ICONS.clock,13)+' الشهر ده: '+fmtDuration(t.mins)+'<\/div>' : '';\n      var mainBtn = open\n        ? '<button class=\"btn btn-out\" data-out=\"'+idx+'\">'+svg(ICONS.logout)+' تسجيل انصراف<\/button>'\n        : '<button class=\"btn btn-in\" data-in=\"'+emp.id+'\">'+svg(ICONS.login)+' تسجيل حضور<\/button>';\n      var delCls = confirmingId===emp.id ? 'btn btn-del btn-del-confirm' : 'btn btn-del';\n      var delTxt = confirmingId===emp.id ? 'تأكيد' : 'حذف';\n      return '<div class=\"row\"><div class=\"who\"><div class=\"avatar\" style=\"background:linear-gradient(135deg,'+c[0]+','+c[1]+')\">'+esc(emp.name.trim().charAt(0))+'<\/div><div class=\"who-text\"><div class=\"name\">'+esc(emp.name)+'<\/div>'+badge+chip+'<\/div><\/div><div class=\"actions\">'+mainBtn+'<button class=\"'+delCls+'\" data-del=\"'+emp.id+'\">'+svg(ICONS.trash)+' '+delTxt+'<\/button><\/div><\/div>';\n    }).join('');\n  }\n  document.getElementById('empList').innerHTML = empHtml;\n\n  var todayRows = cur.rows.map(function(r, idx){ return { r:r, idx:idx }; })\n    .filter(function(x){ return x.r[1]===todayOffset; })\n    .sort(function(a,b){ return a.r[2]-b.r[2]; });\n  if(todayRows.length===0){\n    document.getElementById('todayList').innerHTML = '<p class=\"hint\">لسه مفيش تسجيلات النهاردة.<\/p>';\n    document.getElementById('copyDay').style.display = 'none';\n  } else {\n    document.getElementById('todayList').innerHTML = todayRows.map(function(x){\n      var r = x.r;\n      var badge = r[3]===null\n        ? '<div class=\"badge badge-in\">حضور '+fmtTime(r[2])+' - لسه شغال<\/div>'\n        : '<div class=\"badge badge-done\">'+fmtTime(r[2])+' - '+fmtTime(r[3])+' · '+fmtDuration(r[3]-r[2])+'<\/div>';\n      return '<div class=\"row\"><div class=\"who\"><div class=\"who-text\"><div class=\"name\">'+esc(empName(r[0]))+'<\/div>'+badge+'<\/div><\/div><\/div>';\n    }).join('');\n    document.getElementById('copyDay').style.display = '';\n  }\n  var attended = {}; todayRows.forEach(function(x){ attended[x.r[0]] = true; });\n  var absent = employees.filter(function(e){ return !attended[e.id]; });\n  var dailyLines = todayRows.map(function(x, n){\n    var r = x.r;\n    var out = r[3]===null ? 'لسه شغال' : 'انصراف '+fmtTime(r[3])+' ('+fmtDuration(r[3]-r[2])+')';\n    return (n+1)+'. '+empName(r[0])+': حضور '+fmtTime(r[2])+' - '+out;\n  });\n  if(absent.length>0) dailyLines.push('لم يحضر: '+absent.map(function(e){return e.name;}).join('، '));\n  window._dailySummary = ['ملخص الحضور - '+dayFmt.format(now)].concat(dailyLines).join('\\n');\n\n  document.getElementById('monthList').innerHTML = monthTableHtml(curTotals);\n  document.getElementById('copyMonth').style.display = employees.length ? '' : 'none';\n  window._monthSummary = monthSummary(cur, curTotals);\n\n  var prevTotals = totalsFor(prev);\n  if(prev.rows.length>0 && employees.length>0){\n    document.getElementById('prevGroup').style.display = '';\n    document.getElementById('prevPeriod').textContent = periodLabel(prev.period);\n    document.getElementById('prevList').innerHTML = monthTableHtml(prevTotals);\n    window._prevSummary = monthSummary(prev, prevTotals);\n  } else {\n    document.getElementById('prevGroup').style.display = 'none';\n  }\n}\nfunction addEmployee(){\n  var input = document.getElementById('nameInput');\n  var parts = input.value.split(/[,،;\\n]+/).map(function(s){ return s.trim(); }).filter(function(s){ return s.length>0; });\n  if(parts.length===0) return;\n  parts.forEach(function(name){\n    employees.push({ id:'e'+(Date.now()%1000000).toString(36)+Math.floor(Math.random()*1296).toString(36), name:name });\n  });\n  input.value = '';\n  saveAll(); render(); input.focus();\n}\ndocument.getElementById('addBtn').addEventListener('click', addEmployee);\ndocument.getElementById('nameInput').addEventListener('keydown', function(e){ if(e.key==='Enter') addEmployee(); });\n\ndocument.getElementById('empList').addEventListener('click', function(ev){\n  var btn = ev.target.closest('button');\n  if(!btn) return;\n  var t = new Date();\n  if(btn.dataset.in){\n    cur.rows.push([btn.dataset.in, dayOffsetOf(t), minutesOf(t), null]);\n    saveAll(); render();\n  } else if(btn.dataset.out){\n    var idx = Number(btn.dataset.out);\n    if(idx>=0 && cur.rows[idx]){ cur.rows[idx][3] = minutesOf(t); saveAll(); render(); }\n  } else if(btn.dataset.del){\n    var id = btn.dataset.del;\n    if(confirmingId !== id){\n      confirmingId = id; render();\n      clearTimeout(confirmTimer);\n      confirmTimer = setTimeout(function(){ confirmingId = null; render(); }, 6000);\n      return;\n    }\n    confirmingId = null; clearTimeout(confirmTimer);\n    employees = employees.filter(function(e){ return e.id!==id; });\n    cur.rows = cur.rows.filter(function(r){ return r[0]!==id; });\n    prev.rows = prev.rows.filter(function(r){ return r[0]!==id; });\n    saveAll(); render();\n  }\n});\ndocument.getElementById('copyDay').addEventListener('click', function(){ copyText(window._dailySummary, this); });\ndocument.getElementById('copyMonth').addEventListener('click', function(){ copyText(window._monthSummary, this); });\ndocument.getElementById('copyPrev').addEventListener('click', function(){ copyText(window._prevSummary, this); });\n\ndocument.getElementById('iconUsers').innerHTML = svg(ICONS.users,18);\ndocument.getElementById('iconAdd').innerHTML = svg(ICONS.userPlus,16);\ndocument.getElementById('iconClock').innerHTML = svg(ICONS.clock,18);\ndocument.getElementById('iconChart').innerHTML = svg(ICONS.chart,18);\ndocument.getElementById('iconCal').innerHTML = svg(ICONS.calendar,18);\nrender();\n<\/script>\n<\/body>\n<\/html>\n";
var STORE_KEY = 'app.html.v1';
window.__bootBuild = 0;
function buildOf(html){ var m = /<!--build:(\d+)-->/.exec(html); return m ? +m[1] : 0; }

var lastTap = 0;

  if (Date.now() - lastTap > 4000) { location.reload(); return; }
  setTimeout(maybeReload, 5000);

function installUpdate(html){
  var b = buildOf(html);

  function tryFetch(url){
    var sep = url.indexOf('?') < 0 ? '?' : '&';
    fetch(url + sep + 'cb=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ if (!r.ok) throw 0; return r.text(); })
      .then(function(text){
        if (text.indexOf('<!--build:') < 0) throw 0;

    var done = false;

    s.onerror = function(){ if (!done) { done = true; next(); } };

    setTimeout(function(){ if (!done) { done = true; next(); } }, 8000);
